name: Render a CV
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    name: RenderCV disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain current CV workflow
        run: |
          echo "This repository no longer uses RenderCV for CV generation."
          echo "_data/cv.yml is rendered by the website and by bin/render_cv_latex.py."
          echo "Generate the LaTeX/PDF CV locally with: python3 bin/render_cv_latex.py"
